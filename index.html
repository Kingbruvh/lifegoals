document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

animation:lghpop .4s ease both\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex:1\"><div style=\"font:700 13px Heebo,sans-serif\">{{ rapStatus }}<\u002Fdiv><div style=\"height:5px;background:#eee;border-radius:4px;margin-top:7px;overflow:hidden\"><div style=\"height:100%;width:{{ rapProg }};background:linear-gradient(90deg,#D53845,#D14C33);border-radius:4px;transition:width 2.1s linear\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:700 11px Heebo,sans-serif;color:#999\">Dordrecht · Q2 2026<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"padding:28px 30px\">\n            <!-- report title -->\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;opacity:{{ rs1o }};transform:translateY({{ rs1y }});transition:all .5s cubic-bezier(.22,.61,.36,1);transition-delay:.15s\">\n              <div><div style=\"font:700 11px Heebo,sans-serif;color:#D53845;letter-spacing:1px\">IMPACTRAPPORTAGE<\u002Fdiv><div style=\"font-family:Anton,sans-serif;font-size:26px;line-height:1.05;margin-top:5px\">LIFE GOALS DORDRECHT<\u002Fdiv><\u002Fdiv>\n              <div style=\"width:42px;height:42px;border-radius:11px;background:#252525;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:18px\">LG<\u002Fdiv>\n            <\u002Fdiv>\n            <!-- summary -->\n            <div style=\"margin-top:20px;font:500 14px/1.6 Heebo,sans-serif;color:#555;opacity:{{ rs2o }};transform:translateY({{ rs2y }});transition:all .5s cubic-bezier(.22,.61,.36,1);transition-delay:.5s\">In Q2 2026 bereikte Life Goals Dordrecht <b style=\"color:#252525\">184 deelnemers<\u002Fb>, met een gemiddelde opkomst van <b style=\"color:#252525\">71%<\u002Fb>. <b style=\"color:#252525\">14 deelnemers<\u002Fb> stroomden door naar een vereniging of vrijwilligersrol — de sterkste groei zat op sociale verbinding.<\u002Fdiv>\n            <!-- kpis -->\n            <div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;opacity:{{ rs3o }};transform:translateY({{ rs3y }});transition:all .5s cubic-bezier(.22,.61,.36,1);transition-delay:.9s\">\n              <div style=\"background:#FAFAFA;border-radius:13px;padding:16px\"><div style=\"font-family:Anton,sans-serif;font-size:26px\">184<\u002Fdiv><div style=\"font:600 11px Heebo,sans-serif;color:#888;margin-top:3px\">Deelnemers<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#FAFAFA;border-radius:13px;padding:16px\"><div style=\"font-family:Anton,sans-serif;font-size:26px;color:#D14C33\">71%<\u002Fdiv><div style=\"font:600 11px Heebo,sans-serif;color:#888;margin-top:3px\">Opkomst<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#FAFAFA;border-radius:13px;padding:16px\"><div style=\"font-family:Anton,sans-serif;font-size:26px;color:#2E9E6B\">14<\u002Fdiv><div style=\"font:600 11px Heebo,sans-serif;color:#888;margin-top:3px\">Doorstroom<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <!-- chart + quote -->\n            <div style=\"margin-top:16px;display:grid;grid-template-columns:1.3fr 1fr;gap:14px;opacity:{{ rs4o }};transform:translateY({{ rs4y }});transition:all .5s cubic-bezier(.22,.61,.36,1);transition-delay:1.3s\">\n              <div style=\"background:#FAFAFA;border-radius:13px;padding:16px 18px\"><div style=\"font:700 12px Heebo,sans-serif;color:#888;margin-bottom:8px\">Impactgroei<\u002Fdiv><svg viewBox=\"0 0 360 90\" style=\"width:100%;height:auto\"><polyline points=\"6,80 66,68 126,58 186,44 246,32 306,22 354,16\" fill=\"none\" stroke=\"#D53845\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpolyline><polygon points=\"6,84 6,80 66,68 126,58 186,44 246,32 306,22 354,16 354,84\" fill=\"rgba(213,56,69,.08)\"><\u002Fpolygon><\u002Fsvg><\u002Fdiv>\n              <div style=\"background:#FAF8DB;border-radius:13px;padding:16px 18px;display:flex;align-items:center\"><div style=\"font:500 13px/1.5 Heebo,sans-serif;font-style:italic;color:#3a3a2e\">\"Nu sta ik elke week op het veld en heb ik vrienden gemaakt.\"<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- actions -->\n          <div style=\"border-top:1px solid #f0f0f0;padding:18px 30px;display:flex;gap:10px;flex-wrap:wrap;opacity:{{ rs5o }};transform:translateY({{ rs5y }});transition:all .5s cubic-bezier(.22,.61,.36,1);transition-delay:1.7s\">\n            <button style=\"display:flex;align-items:center;gap:8px;background:#D53845;color:#fff;border:none;border-radius:10px;padding:11px 17px;font:700 13px Heebo,sans-serif;cursor:pointer\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 3v12M7 10l5 5 5-5\"><\u002Fpath><\u002Fsvg>PDF<\u002Fbutton>\n            <button style=\"display:flex;align-items:center;gap:8px;background:#252525;color:#fff;border:none;border-radius:10px;padding:11px 17px;font:700 13px Heebo,sans-serif;cursor:pointer\">PowerPoint<\u002Fbutton>\n            <button style=\"display:flex;align-items:center;gap:8px;background:#fff;color:#252525;border:1px solid #e2e2e2;border-radius:10px;padding:11px 17px;font:700 13px Heebo,sans-serif;cursor:pointer\">Deel met partner<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'deeln',\n    shown: { deeln:false, act:false, impact:false, rap:false },\n    checked: { samir:true, jordy:true, mo:false, eva:true, dani:false },\n    qrAdded: false,\n    counts: { c1:0, c2:0, c3:0, c4:0 },\n    impactP: 0,\n    rapPhase: 0   // 0 idle, 1 busy, 2 done\n  };\n\n  roster = [\n    { id:'samir', naam:'Samir A.', note:'' },\n    { id:'jordy', naam:'Jordy K.', note:'' },\n    { id:'eva', naam:'Eva D.', note:'' },\n    { id:'mo', naam:'Mohammed R.', note:'3 weken niet gezien' },\n    { id:'dani', naam:'Dani M.', note:'eerste keer' }\n  ];\n\n  targets = { c1:3248, c2:74, c3:312, c4:87 };\n\n  go = {};\n  _built = false;\n  _build(){\n    if(this._built) return;\n    ['deeln','act','impact','rap'].forEach(id=>{ this.go[id]=()=>this.navTo(id); });\n    this._built = true;\n  }\n\n  componentDidMount(){ this._build(); this.navTo(this.props.start || 'deeln'); }\n\n  navTo(id){\n    this.setState({ screen:id, shown:{...this.state.shown, [id]:false}, rapPhase: id==='rap'?this.state.rapPhase:0 });\n    clearTimeout(this._revT);\n    this._revT = setTimeout(()=>{ this.setState({shown:{...this.state.shown,[id]:true}}); }, 60);\n    if(id==='impact') this.runCounts();\n    if(id==='rap') this.runReport();\n  }\n\n  runCounts(){\n    clearInterval(this._cIv);\n    const start = Date.now(), dur = 1250, step = 28;\n    this.setState({counts:{c1:0,c2:0,c3:0,c4:0}, impactP:0});\n    this._cIv = setInterval(()=>{\n      const p = Math.min(1, (Date.now()-start)/dur);\n      const e = 1-Math.pow(1-p,3);\n      this.setState({ counts:{\n        c1: Math.round(this.targets.c1*e),\n        c2: Math.round(this.targets.c2*e),\n        c3: Math.round(this.targets.c3*e),\n        c4: Math.round(this.targets.c4*e)\n      }, impactP: e });\n      if(p>=1) clearInterval(this._cIv);\n    }, step);\n  }\n\n  runReport(){\n    clearTimeout(this._rapT);\n    this.setState({rapPhase:1});\n    this._rapT = setTimeout(()=>{ this.setState({rapPhase:2}); }, 2300);\n  }\n  replay(){ if(this.state.screen!=='rap'){ this.navTo('rap'); } else { this.navTo('rap'); } }\n\n  toggleCheck(id){ this.setState({checked:{...this.state.checked,[id]:!this.state.checked[id]}}); }\n  addQr(){\n    if(this.state.qrAdded) return;\n    this.roster = [...this.roster, { id:'yara', naam:'Yara T.', note:'via QR toegevoegd' }];\n    this.setState({ qrAdded:true, checked:{...this.state.checked, yara:true} });\n  }\n\n  fmt(n){ return n.toLocaleString('nl-NL'); }\n\n  renderVals(){\n    this._build();\n    const s = this.state;\n    const order = ['deeln','act','impact','rap'];\n    const cur = order.indexOf(s.screen);\n\n    // screen reveal helper\n    const sc = (id) => { const on = s.screen===id; const shown = on && s.shown[id];\n      return { o:on?1:0, y:on?'0px':'10px', y2:shown?'0px':'18px', pe:on?'auto':'none', z:on?2:1, shown };\n    };\n    const d=sc('deeln'), a=sc('act'), i=sc('impact'), r=sc('rap');\n\n    // ribbon steps\n    const step={}, stepNum={};\n    order.forEach((id,idx)=>{\n      const active = idx===cur, done = idx<cur;\n      const bg = active ? '#D53845' : (done ? '#252525' : '#f1f1f1');\n      const col = (active||done) ? '#fff' : '#999';\n      step[id] = 'display:flex;align-items:center;gap:8px;border:none;border-radius:30px;padding:8px 15px 8px 9px;cursor:pointer;font:700 13px Heebo,sans-serif;background:'+bg+';color:'+col+';transition:all .4s cubic-bezier(.22,.61,.36,1);transform:scale('+(active?1.04:1)+')';\n      stepNum[id] = 'width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 10px Heebo,sans-serif;background:'+(active?'rgba(255,255,255,.25)':(done?'rgba(255,255,255,.18)':'#e2e2e2'))+';color:'+col;\n    });\n    const line = { a: cur>=1?'#D53845':'#e2e2e2', b: cur>=2?'#D53845':'#e2e2e2', c: cur>=3?'#D53845':'#e2e2e2' };\n\n    // deelnemer journey\n    const jline = d.shown ? 'calc(82% )' : '0%';\n    const jdot = d.shown ? '#D53845' : '#d8d8d8';\n    const jdotLast = d.shown ? '#e8a13a' : '#d8d8d8';\n\n    // activiteit roster\n    const rosterView = this.roster.map(rr=>{ const on = s.checked[rr.id];\n      return { naam:rr.naam, ini:rr.naam.split(' ').map(w=>w[0]).join(''),\n        note: rr.note || (on?'Ingecheckt':'Nog niet ingecheckt'),\n        noteC: rr.note ? '#D14C33' : (on?'#2E9E6B':'#aaa'),\n        av: on?'#2E9E6B':'#c4c4c4', bg: on?'#f4faf6':'#FAFAFA',\n        check: on?'#2E9E6B':'#dcdcdc', scale: on?1:.82,\n        toggle:()=>this.toggleCheck(rr.id) };\n    });\n    const aanwezig = this.roster.filter(rr=>s.checked[rr.id]).length;\n\n    // impact\n    const barTargets = [ ['Zelfvertrouwen','+24%',0.78], ['Sociale verbinding','+31%',0.88], ['Gezondheid','+18%',0.66] ];\n    const bars = barTargets.map(b=>({ th:b[0], delta:b[1], s: (b[2]*(s.impactP||0)).toFixed(3) }));\n\n    // rapportage phases\n    const rapBusy = s.rapPhase===1, rapDone = s.rapPhase===2;\n    const rapStatus = rapDone ? 'Rapport klaar voor export' : 'Rapport genereren…';\n    const rapProg = (s.rapPhase>=1) ? '100%' : '0%';\n    const seg = (n)=>{ // section reveal: appear in sequence while busy/done\n      const vis = s.rapPhase>=1 && r.shown;\n      return { o: vis?1:0, y: vis?'0px':'14px' };\n    };\n    const rsegDelays=[0,1,2,3,4];\n    const rseg = rsegDelays.map(()=>seg());\n\n    return {\n      go:this.go,\n      step, stepNum, line,\n      d, a, i, r,\n      jline, jdot, jdotLast,\n      rosterView, aanwezig, totaal:this.roster.length,\n      addQr:()=>this.addQr(), qrAdded:s.qrAdded,\n      toastO: s.qrAdded?1:0, toastY: s.qrAdded?'0px':'10px',\n      c1:this.fmt(s.counts.c1), c2:s.counts.c2, c3:this.fmt(s.counts.c3), c4:s.counts.c4,\n      bars,\n      replay:()=>this.replay(),\n      rapBusy, rapDone, rapStatus, rapProg,\n      rs1o:rseg[0].o, rs1y:rseg[0].y, rs2o:rseg[1].o, rs2y:rseg[1].y,\n      rs3o:rseg[2].o, rs3y:rseg[2].y, rs4o:rseg[3].o, rs4y:rseg[3].y,\n      rs5o:rseg[4].o, rs5y:rseg[4].y\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
